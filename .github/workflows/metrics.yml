name: Generate GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1' # weekly (Monday), off the top of the hour

permissions: {}

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # metrics commits the SVG itself, through the API, with github.token
    steps:
      - name: Generate Metrics SVG
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # Token stored in repository secrets (see README notes)
          token: ${{ secrets.METRICS_TOKEN }}

          # Output filename (committed to the default branch by the action)
          filename: github-languages.svg

          # Minimal base to keep output compact (only plugins shown)
          base: ""

          # User to collect metrics for
          user: NoahJenkins

          # Enable languages plugin and keep it compact
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
